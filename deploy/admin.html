<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LitchiLens · 重调工作台</title>
<style>body{font:16px system-ui;margin:30px auto;padding:0 20px;max-width:1100px;background:#101913;color:#edf4ea}button,a,select{font:inherit;color:inherit;background:#243728;border:1px solid #527051;padding:10px;border-radius:6px}a{text-decoration:none;display:inline-block}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.request{border:1px solid #405041;border-radius:12px;padding:22px;margin:20px 0}.photos{display:flex;gap:12px;flex-wrap:wrap}.photo{width:180px}.photo img{width:180px;height:135px;object-fit:cover}.muted{color:#adbcad;font-size:14px}.reason{white-space:pre-wrap;line-height:1.8}.actions{display:flex;gap:12px;margin-top:20px}.status{margin-top:12px;color:#c3ed78}h1{font-size:26px}.note{line-height:1.8}select{max-width:100%}</style>
<h1>LitchiLens · 重调工作台</h1><p class="note">根据缩略图和 DSC 编号定位原片。重调后沿用编号导出 JPG，再更新该照片 ID 的版本；标记完成本身不会上传新照片。</p>
<header><label>查看 <select id="filter"><option>待处理</option><option>处理中</option><option>已完成</option><option value="">全部</option></select></label><button id="refresh">刷新</button><a href="requests.csv" download>导出待处理 CSV</a></header><p id="summary" role="status"></p><main id="requests"></main>
<script>
const $=id=>document.getElementById(id);let data;
async function load(){try{const response=await fetch('requests',{cache:'no-store'});if(!response.ok)throw Error('连接失败');data=await response.json();render();}catch(e){$('summary').textContent=e.message;}}
function render(){const rows=data.requests.filter(r=>!$('filter').value||r.status===$('filter').value);$('summary').textContent=`待处理 ${data.requests.filter(r=>r.status==='待处理').length} 条 · 处理中 ${data.requests.filter(r=>r.status==='处理中').length} 条 · 当前显示 ${rows.length} 条`;$('requests').replaceChildren();
for(const r of rows.slice().reverse()){const card=document.createElement('article');card.className='request';const title=document.createElement('h2');title.textContent=`${r.status} · ${r.ids.length} 张照片`;const meta=document.createElement('p');meta.className='muted';meta.textContent=`申请 ${r.id} · ${new Date(r.created).toLocaleString('zh-CN')}`;const reason=document.createElement('p');reason.className='reason';reason.textContent=r.reason;card.append(title,meta,reason);const photos=document.createElement('div');photos.className='photos';for(const id of r.ids){const p=data.photos[id];if(!p)continue;const box=document.createElement('div');box.className='photo';const img=new Image();img.src='asset/'+p.thumb;img.alt=id;img.loading='lazy';const name=document.createElement('p');name.textContent=id;const a=document.createElement('a');a.href='asset/'+(p.nef?.url||p.jpg.url);a.download=id+(p.nef?'.NEF':'.jpg');a.textContent=p.nef?'下载 NEF':'下载 JPG';box.append(img,name,a);if(p.hidden){const status=document.createElement('p');status.textContent='此 ID 已被下架';box.append(status);}photos.append(box);}card.append(photos);const actions=document.createElement('div');actions.className='actions';const status=document.createElement('p');status.className='status';for(const value of ['待处理','处理中','已完成']){const button=document.createElement('button');button.textContent='标记'+value;button.disabled=value===r.status;button.onclick=async()=>{button.disabled=true;try{const response=await fetch('update',{method:'POST',headers:{'Content-Type':'application/json','X-LitchiLens':'1'},body:JSON.stringify({request_id:r.id,status:value})});if(!response.ok)throw Error('保存失败');await load();}catch(e){status.textContent=e.message;button.disabled=false;}};actions.append(button);}card.append(actions,status);$('requests').append(card);}}
$('filter').onchange=render;$('refresh').onclick=load;load();
</script></html>
